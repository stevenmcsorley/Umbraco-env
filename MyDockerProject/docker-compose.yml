services:
  umb_database:
    container_name: mydockerproject_database
    build:
      context: ./Database
    environment:
      SA_PASSWORD: ${DB_PASSWORD}
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
    ports:
      - "1433:1433"
      - "1434:1434"
    volumes:
      - umb_database:/var/opt/mssql
    networks:
      - umbnet
    healthcheck:
      # This healthcheck is to make sure that the database is up and running before the umbraco container starts.
      # It works by querying the database for the state of the umbracoDb database, ensuring it exists.
      test: ./healthcheck.sh
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 15s # Bootstrap duration, for this duration failures does not count towards max retries.
      start_interval: 5s # How long after the health check has started to run the healthcheck again.

  mydockerproject:
    image: mydockerproject
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__umbracoDbDSN=Server=umb_database;Database=umbracoDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=true;
      - ConnectionStrings__umbracoDbDSN_ProviderName=Microsoft.Data.SqlClient
      - BOOKING_ENGINE_URL=http://booking_engine:3001
      - SiteKit__AdminEmails=${SITEKIT_ADMIN_EMAILS:-}
      - SiteKit__AdminRegistrationCode=${SITEKIT_ADMIN_REGISTRATION_CODE:-}
      - SiteKit__PublicBaseUrl=${SITEKIT_PUBLIC_BASE_URL:-}
      - SiteKit__DataProtectionKeyPath=/app/umbraco/DataProtection-Keys
      - Umbraco__Automate__UseNamedConnectionString=umbracoDbDSN
    volumes:
      - umb_media:/app/wwwroot/media
      - umb_logs:/app/umbraco/Logs
      - ./MyDockerProject/Views:/app/Views:ro
      - umb_data:/app/umbraco
      - umb_models:/app/umbraco/models
    build:
      context: ..
      dockerfile: MyDockerProject/MyDockerProject/Dockerfile
      args:
        - BUILD_CONFIGURATION=Debug

    depends_on:
      umb_database:
        condition: service_healthy
    restart: always
    ports:
      - "44372:8080"
    networks:
      - umbnet
    develop:
      # This allows you to run docker compose watch, after doing so the container will rebuild when the models are changed.
      # Once a restart only feature is implemented (https://github.com/docker/compose/issues/11446)
      # It would be really nice to add a restart only watch to \Views, since the file watchers for recompilation of Razor views does not work with docker.
      watch:
        - path: ./MyDockerProject/umbraco/models
          action: rebuild

  booking_engine:
    build:
      context: ./engine
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - UMBRACO_API_BASE=http://mydockerproject:8080/api
      - USE_UMBRACO_ADAPTER=true
    networks:
      - umbnet
    restart: always
    depends_on:
      - mydockerproject
      - umb_database

  frontend_dev:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0
    networks:
      - umbnet
    environment:
      - NODE_ENV=development
    profiles:
      - dev

# Views and generated models remain bind-mounted for local editing. Built React
# assets stay in the image so source bind mounts cannot shadow the Docker build.
volumes:
  umb_media:
    driver: local
    driver_opts:
      type: none
      device: ./MyDockerProject/wwwroot/media
      o: bind
  umb_logs:
  umb_data:
  umb_models:
    driver: local
    driver_opts:
      type: none
      device: ./MyDockerProject/umbraco/models
      o: bind
  umb_database:

networks:
  umbnet:
    driver: bridge
