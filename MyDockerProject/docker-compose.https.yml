services:
  mydockerproject:
    environment:
      ASPNETCORE_URLS: http://+:8080;https://+:8443
      ASPNETCORE_HTTPS_PORT: 44373
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/sitekit-dev.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: ${SITEKIT_HTTPS_CERT_PASSWORD:?Set SITEKIT_HTTPS_CERT_PASSWORD before starting the HTTPS overlay}
    ports:
      - "44373:8443"
    volumes:
      - ./https:/https:ro
