name: SiteKit build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore solution
        run: dotnet restore UmbraccoEnv.sln
      - name: Test SiteKit core contracts and storage
        run: dotnet test SiteKit.Core.Tests/SiteKit.Core.Tests.csproj --no-restore --configuration Release
      - name: Check known vulnerable packages
        run: |
          dotnet list MyDockerProject/MyDockerProject/MyDockerProject.csproj package --vulnerable --include-transitive --format json > "$RUNNER_TEMP/sitekit-vulnerability-report.json"
          python scripts/check_nuget_vulnerabilities.py "$RUNNER_TEMP/sitekit-vulnerability-report.json"
      - name: Build solution
        env:
          SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}
        run: |
          if [[ -n "$SIXLABORS_LICENSE_KEY" ]]; then
            dotnet build UmbraccoEnv.sln --no-restore --configuration Release -p:SixLaborsLicenseKey="$SIXLABORS_LICENSE_KEY"
          else
            echo "No Six Labors build key configured; validating the open-source Debug build."
            dotnet build UmbraccoEnv.sln --no-restore --configuration Debug
          fi
